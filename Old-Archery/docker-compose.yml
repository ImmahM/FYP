
services:
  customarcherysecdb:
    image: postgres:12-alpine
    volumes:
      - dbdata:/var/lib/postgresql/data
    # ports:
    #   - "5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    container_name: old-customarcherysecdb
    networks:
      - old-net_customarcherysec

  customarcherysec:
    build: .
    ports:
      - "8990:8000"
    expose:
      - "8000"
    depends_on:
      - customarcherysecdb
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - NAME=${NAME}
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT}
    container_name: old-customarcherysec
    networks:
      - old-net_customarcherysec
      # - external_net

  customarcherysec-worker:
    build: .
    depends_on:
      - customarcherysecdb
      - customarcherysec
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - NAME=${NAME}
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - ARCHERY_WORKER=${ARCHERY_WORKER}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT}
    container_name: old-customarcherysec-worker
    networks:
      - old-net_customarcherysec

  zaproxy:
    image: zaproxy/zap-stable
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    # ports:
    #   - "8090"
    expose:
      - "8090"
    environment:
      - ZAP_PORT=8090
    container_name: old-zapscanner
    networks:
      - old-net_customarcherysec

 
  arachni:
    image: arachni/arachni
    # ports:
    #   - "9292"
    #   - "7331"
    expose:
      - "9292"
      - "7331"
    environment:
      - ARACHNI_PARAMS=${ARACHNI_PARAMS}
    container_name: old-arachniscanner
    networks:
      - old-net_customarcherysec

  mailhog:
    image: mailhog/mailhog
    # ports:
    #   - "1025"
    #   - "8025"
    expose:
      - "1025"
      - "8025"
    container_name: old-mailhog
    networks:
      - old-net_customarcherysec

# default user is admin (admin)
  openvas:
    image: mikesplain/openvas
    # ports:
    #   - "443:443"
    #   - "9390:9390"
    #   - "9392:9392"
    expose:
      - "9390"
      - "9392"
      - "443"
    depends_on:
      - customarcherysec
    container_name: old-customarcherysecopenvas
    networks:
      - old-net_customarcherysec

networks:
  old-net_customarcherysec:
    name: old-net_customarcherysec
    driver: bridge
    # internal: true
  # external_net:
  #   name: external_net
  #   driver: bridge

volumes:
  dbdata:
