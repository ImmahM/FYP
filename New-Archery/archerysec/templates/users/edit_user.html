{% extends 'base/site_base.html' %}
{% load custom_tags %}
{% load rest_framework %}

{% block body %}

<div class="row justify-content-md-center">
    <div class="col-8">
        <div class="card">
            <div class="card-body">
                <div class="d-md-flex align-items-center">
                    <h1 class="card-title">User Details</h1>
                </div>
                <br>
                <div class="card">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="widget-box">{% for data in user_details %}
                                    <form class="form-horizontal"
                                          action="{% url 'users:edit_user' uu_id=user_uu_id %}" method="POST">
                                        {% csrf_token %}
                                        <div id="error_summary" class="alert alert-danger" style="display:none;"></div>
                                        <div class="form-group ">
                                            <label>Name</label>
                                            <input name="name" class="form-control" type="text" value="{{ data.name }}">
                                        </div>
                                        <div class="form-group ">
                                            <label>Email</label>
                                            <input id="email" name="email" class="form-control" type="text"
                                                   value="{{ data.email }}">
                                            <div id="error_email" class="text-danger small err-msg"></div>
                                        </div>
                                        <div class="form-group ">
                                            <label>Image</label>
                                            <input name="image" class="form-control" type="text" value="{{ data.image }}"
                                                   placeholder="Image">
                                        </div>
                                        <div class="form-group ">
                                            <label>Pass token</label>
                                            <input name="pass_token" class="form-control" type="text" value="{{ data.pass_token }}"
                                                   placeholder="Pass token">
                                        </div>
                                        <div class="form-group ">
                                            <label>Organization</label>
                                            <div class="dtsb-criteria">
                                                {% if user.is_superuser or user.role.role == 'Admin' %}
                                                    <select class="form-control dtsb-data dtsb-dropDown" name="organization" style="width: 100%; height:36px;">
                                                        <optgroup label="Selected">
                                                            <option value="{{ data.organization.pk }}" selected>{{ data.organization }}</option>
                                                        </optgroup>
                                                        {% for data in org %}
                                                            <option value="{{ data.pk }}">{{ data.name }}</option>
                                                        {% endfor %}
                                                    </select>
                                                {% else %}
                                                    <input type="hidden" name="organization" value="{{ user.organization.pk }}" />
                                                    <input class="form-control" value="{{ user.organization }}" disabled />
                                                {% endif %}
                                            </div>
                                        </div>

                                        <div class="form-group ">
                                            <label>Role</label>
                                            <div class="dtsb-criteria">
                                                <select id="role" class="form-control dtsb-data dtsb-dropDown" name="role" style="width: 100%; height:36px;">
                                                    <option value="{{ data.role.pk }}" selected>{{ data.role|role_display }}</option>
                                                    {% for r in roles %}
                                                        {% if r.pk != data.role.pk %}
                                                            <option value="{{ r.pk }}">{{ r.role|role_display }}</option>
                                                        {% endif %}
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>

                                        <div class="border-top">
                                            <div class="card-body">
                                                <button id="saveBtn" type="submit" class="btn btn-default">Save
                                                </button>
                                            </div>
                                        </div>
                                        {% endfor %}
                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
