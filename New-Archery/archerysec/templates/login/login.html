{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>ArcherySec SaaS</title>
    <link rel="icon" href="{% static 'logo.png' %}" type="image/x-icon">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-responsive.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/archery-login.css' %}"/>
    <link href="{% static 'font-awesome/css/font-awesome.css' %}" rel="stylesheet"/>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,700,800' rel='stylesheet' type='text/css'>
    <style>
        /* Inline reinforcement so the page keeps the centered card even if other CSS overrides */
        body.login-body{
            margin:0;
            min-height:100vh;
            background:#0b0d13;
            background: radial-gradient(circle at 10% 20%, rgba(127, 90, 240, 0.25), transparent 30%),
                       radial-gradient(circle at 80% 0%, rgba(124, 243, 255, 0.18), transparent 35%),
                       radial-gradient(circle at 30% 90%, rgba(255, 124, 92, 0.15), transparent 45%),
                       linear-gradient(135deg, #0b0d13, #0f1424);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px 12px;
            color:#cbd5e1;
            font-family:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .login-shell{width:min(520px,100%);}
        .login-card{
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(16, 19, 30, 0.9));
            border:1px solid rgba(255,255,255,0.08);
            border-radius:24px;
            box-shadow:0 24px 48px rgba(0,0,0,0.35), 0 12px 28px rgba(127,90,240,0.3);
            padding:26px 26px 22px;
            backdrop-filter: blur(12px);
        }
        .login-logo img{max-width:200px;}
        .input-row{
            display:flex;
            align-items:center;
            gap:10px;
            background:linear-gradient(135deg, rgba(255,255,255,0.04), rgba(127,90,240,0.12));
            border:1px solid rgba(255,255,255,0.08);
            border-radius:14px;
            padding:10px 12px;
            box-shadow: inset 0 0 0 1px rgba(127,90,240,0.25);
        }
        .input-row input{
            flex:1;
            background:transparent;
            border:none;
            color:#f8fafc;
            font-weight:700;
            letter-spacing:0.01em;
        }
        .btn-login{
            width:100%;
            border-radius:14px;
            background: linear-gradient(135deg, #7f5af0, #7cf3ff);
            border:none;
            color:#0b0d13 !important;
            font-weight:800;
            padding:12px 14px;
        }
    </style>

</head>
<body class="login-body">
<div class="login-shell">
    <div class="login-card">
        <div class="login-logo">
            <img src="{% static 'archery.png' %}" alt="ArcherySec Logo"/>
        </div>
        <div class="login-title">Welcome back</div>
        <div class="login-subtitle">Sign in to continue</div>

        {% if messages %}
        <div class="messages">
            {% for msg in messages %}
            <div class="alert alert-{{ msg.level_tag }}" role="alert">
                {{ msg.message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form id="loginform" class="form-vertical mt-2" action="{% url 'auth' %}" method="POST">
            {% csrf_token %}
            <div class="input-block">
                <label class="input-label" for="email">Email</label>
                <div class="input-row">
                    <span class="input-icon"><i class="icon-user"></i></span>
                    <input type="email" name="email" id="email" placeholder="Enter your email" autocomplete="username" required>
                </div>
            </div>

            <div class="input-block">
                <label class="input-label" for="password">Password</label>
                <div class="input-row">
                    <span class="input-icon"><i class="icon-lock"></i></span>
                    <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-login" type="submit">Sign in</button>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/archery.login.js' %}"></script>
</body>

</html>
