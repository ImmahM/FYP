{% extends 'dashboard/base.html' %}
{% load static %}
{% block body %}

    <div class="row justify-content-md-center">
        <div class="col-8">
            <div class="card">
                <div class="card-body">
                    <div class="d-md-flex align-items-center">
                        <h1 class="card-title">Profile</h1>
                    </div>
                    <br>
                    <div class="card">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="card">
                            {% for profile in profiles %}
                            <div class="form-group row">
                                <label for="staticEmail" class="col-sm-2 col-form-label">Name</label>
                                <div class="col-sm-10">
                                    <input type="text" readonly class="form-control-plaintext"
                                           id="staticEmail"
                                           value="{{ profile.name }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label for="staticEmail" class="col-sm-2 col-form-label">Email</label>
                                <div class="col-sm-10">
                                    <input type="text" readonly class="form-control-plaintext"
                                           id="staticEmail"
                                           value="{{ profile.email }}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label for="staticEmail"
                                       class="col-sm-2 col-form-label">Organisation</label>
                                <div class="col-sm-10">
                                    <input type="text" readonly class="form-control-plaintext"
                                           id="staticEmail"
                                           value="{{ profile.organization }}">
                                </div>
                            </div>
                            {% endfor %}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-4">
                        <div class="card-body">
                            <div class="d-md-flex align-items-center">
                                <h4 class="card-title">Change Password</h4>
                            </div>
                            <form method="POST" action="{% url 'users:profile' %}">
                                {% csrf_token %}
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">Current Password</label>
                                    <div class="col-sm-9">
                                        <input type="password" name="old_password" class="form-control" required>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">New Password</label>
                                    <div class="col-sm-9">
                                        <input type="password" name="new_password1" class="form-control" required>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">Confirm New Password</label>
                                    <div class="col-sm-9">
                                        <input type="password" name="new_password2" class="form-control" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary">Update Password</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="card-body">
                            <div class="d-md-flex align-items-center">
                                <h4 class="card-title">Notification Preferences</h4>
                            </div>
                            <form method="POST" action="{% url 'users:notification_prefs' %}">
                                {% csrf_token %}
                                {% for profile in profiles %}
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_email"
                                                   name="notify_email" value="true"
                                                   {% if profile.notify_email %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_email">Receive email notifications</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_in_app"
                                                   name="notify_in_app" value="true"
                                                   {% if profile.notify_in_app %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_in_app">Receive in-app notifications</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_on_scan_start"
                                                   name="notify_on_scan_start" value="true"
                                                   {% if profile.notify_on_scan_start %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_on_scan_start">Notify when a scan starts</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_on_scan_complete"
                                                   name="notify_on_scan_complete" value="true"
                                                   {% if profile.notify_on_scan_complete %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_on_scan_complete">Notify when a scan completes</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_on_scan_fail"
                                                   name="notify_on_scan_fail" value="true"
                                                   {% if profile.notify_on_scan_fail %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_on_scan_fail">Notify when a scan fails</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-9 offset-sm-3">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notify_critical_only"
                                                   name="notify_critical_only" value="true"
                                                   {% if profile.notify_critical_only %}checked{% endif %}>
                                            <label class="custom-control-label" for="notify_critical_only">Only notify for critical/high severity findings</label>
                                        </div>
                                    </div>
                                </div>
                                {% endfor %}
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary">Save Preferences</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>


{% endblock %}
